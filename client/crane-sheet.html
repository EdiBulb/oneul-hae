<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#f7f2ea}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { blueCrane, craneEmblem } from './src/crane.ts';
const q = new URLSearchParams(location.search), mode = q.get('m') || 'sheet';
if (mode === 'emblem') { const c = craneEmblem(1024, q.get('bg') ?? '#1f2a4a'); c.style.width = '512px'; document.body.appendChild(c); window.done = true; }
else {
  const W = 1200, H = 700, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setClearColor(0xf3ece2); document.body.appendChild(r.domElement);
  const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0x8a7a8a, 2.4)); const dl = new THREE.DirectionalLight(0xfff4e0, 1.6); dl.position.set(3, 5, 4); sc.add(dl);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); cam.position.set(0.2, 1.4, 10.5); cam.lookAt(0, 1.0, 0);
  const items = [];
  const add = (pose, x, ry, y = 0) => { const c = blueCrane(pose); c.g.position.set(x, y, 0); c.g.rotation.y = ry; sc.add(c.g); items.push(c); };
  add('stand', -2.6, Math.PI / 2); add('stand', -0.6, 0.5); add('stand', 1.3, Math.PI + 0.4);
  add('fly', 2.9, 0.9, 1.5); items[3].g.rotation.x=0.45; items[3].g.scale.setScalar(0.85);
  const fl = new THREE.Mesh(new THREE.CircleGeometry(6, 32), new THREE.MeshBasicMaterial({ color: 0xe6dccc })); fl.rotation.x = -Math.PI / 2; fl.position.y = -0.01; sc.add(fl);
  const t = +(q.get('t') || 900); for (const c of items) c.update(t); r.render(sc, cam); window.done = true;
}
</script></body></html>
